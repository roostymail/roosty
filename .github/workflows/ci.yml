name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repository guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Secrets, private data, bidi characters, large files
        run: scripts/check-repo.sh --all

  go:
    name: Go (vet, staticcheck, tests, govulncheck)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./... && go vet -tags integration ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Unit tests (race detector, coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Short fuzzing
        run: |
          go test ./internal/mail -run=^$ -fuzz=FuzzSanitize -fuzztime=30s
          go test ./internal/settings -run=^$ -fuzz=FuzzParsePrefs -fuzztime=30s
          go test ./internal/mail -run=^$ -fuzz=FuzzParse$ -fuzztime=30s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    name: Integration (${{ matrix.server }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: greenmail
            imap: 127.0.0.1:13143
            smtp: 127.0.0.1:13025
            security: none
          - server: dovecot
            imap: 127.0.0.1:13144
            smtp: none
            security: starttls
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start ${{ matrix.server }}
        working-directory: .
        run: docker compose -f deploy/test/compose.yml up -d ${{ matrix.server }}
      - name: Wait for the mail server
        run: |
          port="${{ matrix.imap }}"; port="${port##*:}"
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break; sleep 1; done
          sleep 3
      - name: Integration tests
        env:
          ROOSTY_IT_IMAP: ${{ matrix.imap }}
          ROOSTY_IT_SMTP: ${{ matrix.smtp }}
          ROOSTY_IT_IMAP_SECURITY: ${{ matrix.security }}
          ROOSTY_IT_SKIP_VERIFY: "1"
        run: go test -race -tags integration -count=1 -v ./internal/server/ 2>&1 | tee /tmp/it.log | grep -E '^(--- |ok|FAIL|PASS)'; exit ${PIPESTATUS[0]}

  web:
    name: Web (typecheck, unit tests, build, audit, size)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx tsc --noEmit -p .
        working-directory: web
      - name: Unit tests (Vitest)
        run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: scripts/check-size.sh

  e2e:
    name: Docker image and browser end-to-end
    runs-on: ubuntu-24.04
    needs: [guard]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build and start the stack
        run: |
          docker compose up --build -d
          docker compose wait seed
          for i in $(seq 1 60); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
      - name: Image size budget
        run: scripts/check-size.sh roostymail/roosty:dev
      - name: Walkthrough
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npm test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color roosty | tail -200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          retention-days: 7
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: roostymail/roosty:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
